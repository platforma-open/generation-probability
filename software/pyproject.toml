[project]
name = "generation-probability-calc-script"
version = "0.0.0"
requires-python = ">=3.12.0, <3.13"
# Runtime dependencies installed at run time — single source of truth. These exact
# pins are exported to src/requirements.txt via `pnpm deps:export` and installed
# offline (pip install --no-index) from the dedicated runenv's wheelhouse
# (runenv-python-3:3.12.10-pgen), which bundles these plus their transitive closure
# (olga pulls numba/llvmlite). Keep versions aligned with that runenv's config.json.
dependencies = [
    "olga==1.3.0",
    "polars-lts-cpu==1.33.1",
    "numpy==2.2.6",
]

[dependency-groups]
# Dev-only (not shipped). Present so `uv sync` provides them for local testing.
dev = [
    "pytest>=8.0.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "E501", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
